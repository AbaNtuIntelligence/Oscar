      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 1px solid var(--beige-deep);

      transform: translateY(-4px);
      background-color: white;
      box-shadow: 0 25px 35px -12px rgba(90, 30, 40, 0.15);
    }
    .section-container {
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
      padding-top: 5rem;
      padding-bottom: 5rem;
    }
    @media (min-width: 768px) {
      .section-container {
        padding-top: 7rem;
        padding-bottom: 7rem;
      }
    }
    .btn-primary {
      background-color: var(--maroon-light);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: var(--maroon);
      transform: translateY(-2px);
    }
    .btn-outline {
      border: 2px solid var(--maroon-light);
      color: var(--maroon-light);
      transition: all 0.2s ease;
    }
    .btn-outline:hover {
      background-color: var(--maroon-light);

    .modal-content {

      padding: 0.5rem;

      cursor: pointer;
      z-index: 20;

      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }
    .nav-arrow:hover {
      background-color: rgba(0,0,0,0.75);
      transform: translateY(-50%) scale(1.05);
    }

    .prestige-header {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;

    .header-container {

      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hamburger {
      background-color: var(--maroon-light);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .hamburger:hover {
      background-color: var(--maroon);
      transform: scale(1.02);
    }
    .prestige-sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 25px rgba(0,0,0,0.15);
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 1.5rem;

    ];

    // ----- Modal Component (unchanged) -----
    const MediaModal = ({ isOpen, items, currentIndex, onClose, onNavigate }) => {
      const currentItem = items[currentIndex];
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (!isOpen) return;
          if (e.key === 'ArrowLeft') onNavigate('prev');
          else if (e.key === 'ArrowRight') onNavigate('next');
          else if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onNavigate, onClose]);
      if (!isOpen || !currentItem) return null;
      const handlePrev = (e) => { e.stopPropagation(); onNavigate('prev'); };
      const handleNext = (e) => { e.stopPropagation(); onNavigate('next'); };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={onClose}>
          <div className="modal-content max-w-4xl w-full bg-white rounded-2xl overflow-hidden shadow-2xl relative" onClick={(e) => e.stopPropagation()}>

              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button onClick={handlePrev} className="nav-arrow left-4"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg></button>
            <button onClick={handleNext} className="nav-arrow right-4"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg></button>

              {currentItem.type === "image" ? (
                <img src={currentItem.src} alt={currentItem.title} className="w-full max-h-[60vh] object-contain bg-black/10" />
              ) : (
                <video key={currentItem.src} className="w-full max-h-[60vh]" controls autoPlay poster={currentItem.poster}>
                  <source src={currentItem.src} type="video/mp4" />
                </video>
              )}
            </div>
            <div className="p-6 bg-white">
              <h3 className="text-2xl font-display font-bold text-gray-800">{currentItem.title}</h3>
              <p className="text-gray-600 mt-2">{currentItem.description}</p>
              <div className="mt-4 flex justify-between items-center">
                <div className="flex gap-2">
                  <span className="text-sm bg-maroon-light/10 px-3 py-1 rounded-full text-maroon-light">{currentItem.category}</span>
                  <span className="text-sm bg-beige-deep/50 px-3 py-1 rounded-full text-gray-600">Class of {currentItem.year}</span>
                </div>
                <div className="text-xs text-gray-400">{currentIndex + 1} / {items.length}</div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ----- Main Alumni Page Content (wrapped in Layout) -----
    const AlumniContent = () => {
      const [modalOpen, setModalOpen] = React.useState(false);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const openModal = (idx) => { setCurrentIndex(idx); setModalOpen(true); };
      const closeModal = () => setModalOpen(false);
      const handleNavigate = (dir) => {
        setCurrentIndex(prev => {
          if (dir === 'prev') return prev === 0 ? alumniSpotlights.length - 1 : prev - 1;
          else return prev === alumniSpotlights.length - 1 ? 0 : prev + 1;
        });
      };

      // CTA handlers (simulated alerts)
      const handleDonateToFund = () => alert("Thank you for supporting the Alumni Fund! You will be redirected to our secure donation portal.");
      const handleVolunteer = () => alert("Volunteer sign-up form will open. Join our mentorship or event committees.");
      const handlePartnerWithUs = () => alert("Corporate partnership inquiry form opens. Let's build together.");
      const handleShareStory = () => alert("We'd love to feature your story! Please email alumni@prestigehigh.co.za");

      return (
        <>
          {/* Hero */}
          <div className="relative bg-gradient-to-br from-[#F5EFE2] via-[#F5EFE2]/95 to-[#E2D4B6]/40 overflow-hidden">
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/paper-fibers.png')] opacity-20"></div>
            <div className="section-container relative z-10 text-center">
              <div className="inline-block px-4 py-1 rounded-full bg-[#B84A60]/10 text-[#B84A60] font-semibold text-sm mb-6 tracking-wide">TOGETHER WE RISE</div>
              <h1 className="text-5xl md:text-7xl font-display font-bold text-gray-800 leading-tight">
                Community & <span className="text-[#B84A60]">Alumni</span>
              </h1>
              <div className="maroon-accent-line mx-auto mt-6"></div>
              <p className="mt-6 max-w-2xl mx-auto text-gray-600 text-lg md:text-xl font-light">A lifelong family. Give back, connect, and help shape the next generation of leaders.</p>
              <div className="flex flex-wrap justify-center gap-5 mt-10">
                <button onClick={handleDonateToFund} className="btn-primary text-white font-bold py-3 px-8 rounded-full shadow-lg transition">💰 Alumni Fund for Learner Support</button>
                <button onClick={handleVolunteer} className="btn-outline font-bold py-3 px-8 rounded-full shadow-md transition">🤝 Volunteer as Mentor</button>
                <button onClick={handlePartnerWithUs} className="bg-white/80 hover:bg-white text-maroon-light font-semibold py-3 px-6 rounded-full shadow transition border border-beige-deep">🏗️ Partner in School Building</button>
              </div>
            </div>
          </div>

          {/* Alumni Fund Section */}
          <div className="bg-white/50 py-16">
            <div className="section-container !py-8">
              <div className="grid md:grid-cols-2 gap-10 items-center">
                <div>
                  <span className="text-maroon-light font-semibold text-sm tracking-wide">SUPPORTING FUTURE LEADERS</span>
                  <h2 className="text-3xl md:text-4xl font-display font-bold text-gray-800 mt-2">Alumni Fund for Learner Support</h2>
                  <div className="w-16 h-0.5 bg-maroon-light rounded-full my-4"></div>
                  <p className="text-gray-600 leading-relaxed">The Alumni Fund provides financial assistance for tuition, textbooks, technology, and extracurricular access to talented learners who would otherwise not afford a Prestige education. Since 2010, over 200 students have graduated through this support.</p>
                  <div className="mt-6 bg-beige-deep/30 p-4 rounded-xl">
                    <p className="font-semibold text-gray-800">2025 Goal: R1,500,000</p>
                    <div className="w-full bg-beige-deep rounded-full h-2.5 mt-2"><div className="bg-maroon-light h-2.5 rounded-full" style={{width: '68%'}}></div></div>
                    <p className="text-sm text-gray-500 mt-2">R1,020,000 raised so far. Every contribution counts.</p>
                  </div>
                  <button onClick={handleDonateToFund} className="mt-6 btn-primary text-white font-semibold px-6 py-2 rounded-full">Donate Now →</button>
                </div>
                <div className="prestige-card p-6 text-center">
                  <div className="text-5xl mb-3">🎓</div>
                  <h3 className="text-xl font-display font-bold">Make a direct impact</h3>
                  <p className="text-gray-500 text-sm mt-2">R500 covers one learner's stationery for a year. R5,000 sponsors a full sports kit. R50,000 transforms a classroom.</p>
                  <div className="flex justify-center gap-2 mt-4"><span className="bg-beige-deep/50 px-3 py-1 rounded-full text-xs">Tax-deductible</span><span className="bg-beige-deep/50 px-3 py-1 rounded-full text-xs">100% to learners</span></div>
                </div>
              </div>
            </div>
          </div>

          {/* Alumni Spotlight Grid */}
          <div className="section-container">
            <div className="text-center max-w-3xl mx-auto mb-12">
              <span className="text-maroon-light font-semibold text-sm bg-maroon-light/10 px-4 py-1 rounded-full">INSPIRING STORIES</span>
              <h2 className="text-3xl md:text-4xl font-display font-bold mt-4 text-gray-800">Alumni Spotlight</h2>
              <div className="maroon-accent-line mx-auto mt-3"></div>
              <p className="text-gray-600">Meet some of our outstanding graduates who are making waves worldwide. Click on any card to learn more.</p>
            </div>
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
              {alumniSpotlights.map((alum, idx) => (
                <div key={alum.id} onClick={() => openModal(idx)} className="prestige-card overflow-hidden cursor-pointer group transition-all">
                  <div className="relative h-64 overflow-hidden">
                    {alum.type === "image" ? (
                      <img src={alum.src} alt={alum.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" />
                    ) : (
                      <>
                        <img src={alum.poster} alt={alum.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" />
                        <div className="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/40">
                          <div className="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center text-maroon-light"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
                        </div>
                      </>
                    )}
                  </div>
                  <div className="p-5">
                    <h3 className="font-display font-bold text-xl text-gray-800">{alum.title}</h3>
                    <p className="text-sm text-maroon-light font-medium">{alum.category} | Class of {alum.year}</p>
                    <p className="text-gray-500 text-sm mt-2 line-clamp-2">{alum.description}</p>
                  </div>
                </div>
              ))}
            </div>
            <div className="text-center mt-10">
              <button onClick={handleShareStory} className="btn-outline px-6 py-2 rounded-full">✉️ Share Your Story →</button>
            </div>
          </div>

          {/* Call to Action - Participate in School Building */}
          <div className="bg-maroon-light/10 py-16">
            <div className="section-container !py-8 text-center">
              <h2 className="text-3xl md:text-4xl font-display font-bold text-gray-800">Help Build Our Future</h2>
              <div className="maroon-accent-line mx-auto mt-3"></div>
              <p className="text-gray-600 max-w-2xl mx-auto">Whether through capital campaigns, donating expertise, or contributing to infrastructure, your participation builds a stronger Prestige.</p>
              <div className="flex flex-wrap justify-center gap-6 mt-8">
                <button onClick={handlePartnerWithUs} className="btn-primary text-white font-semibold px-8 py-3 rounded-full shadow-lg">🏗️ Contribute to Building Fund</button>
                <button onClick={handleVolunteer} className="bg-white text-maroon-light font-semibold px-8 py-3 rounded-full shadow border border-maroon-light">👥 Join Advisory Committee</button>
                <button onClick={handleDonateToFund} className="bg-beige-deep text-gray-800 font-semibold px-8 py-3 rounded-full shadow">📘 Sponsor a Classroom</button>
              </div>
              <p className="text-sm text-gray-500 mt-6">All contributions are acknowledged on our donor wall and in annual reports.</p>
            </div>
          </div>

          {/* Community Engagement Cards */}
          <div className="section-container">
            <div className="grid md:grid-cols-3 gap-8">
              <div className="prestige-card p-6 text-center">
                <div className="w-16 h-16 rounded-full bg-maroon-light/20 flex items-center justify-center text-3xl mx-auto mb-4">🌍</div>
                <h3 className="font-display font-bold text-xl">Mentorship Program</h3>
                <p className="text-gray-600 text-sm mt-2">Guide a current learner through career advice, study support, or life skills.</p>
                <button onClick={handleVolunteer} className="mt-4 text-maroon-light font-medium text-sm">Sign up →</button>
              </div>
              <div className="prestige-card p-6 text-center">
                <div className="w-16 h-16 rounded-full bg-maroon-light/20 flex items-center justify-center text-3xl mx-auto mb-4">🏅</div>
                <h3 className="font-display font-bold text-xl">Annual Golf Day</h3>
                <p className="text-gray-600 text-sm mt-2">Join alumni, parents, and staff for our fundraiser. Next event: 15 November 2025.</p>
                <button onClick={handleDonateToFund} className="mt-4 text-maroon-light font-medium text-sm">Register interest →</button>
              </div>
              <div className="prestige-card p-6 text-center">
                <div className="w-16 h-16 rounded-full bg-maroon-light/20 flex items-center justify-center text-3xl mx-auto mb-4">🎓</div>
                <h3 className="font-display font-bold text-xl">Alumni Reunion 2025</h3>
                <p className="text-gray-600 text-sm mt-2">Celebrate decades of excellence. Save the date: 6 December 2025.</p>
                <button onClick={handleShareStory} className="mt-4 text-maroon-light font-medium text-sm">RSVP →</button>
              </div>
            </div>
          </div>

          <MediaModal isOpen={modalOpen} items={alumniSpotlights} currentIndex={currentIndex} onClose={closeModal} onNavigate={handleNavigate} />
        </>
      );
    };

    // Wrap everything in the Layout
    const App = () => (
      <Layout>
        <AlumniContent />
      </Layout>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
