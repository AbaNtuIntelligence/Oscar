    /* Custom theme: beige & maroon (Prestige) */
    :root {

      --maroon-light: #B84A60;

    body {

      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    h1, h2, h3, h4, .font-display {

    .maroon-accent-line {
      width: 5rem;
      height: 0.25rem;
      background-color: var(--maroon-light);
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    .prestige-card {

      padding-bottom: 5rem;

      .section-container {
        padding-top: 7rem;
        padding-bottom: 7rem;
      }

    .btn-primary {
      background-color: var(--maroon-light);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: var(--maroon);
      transform: translateY(-2px);
    }
    .btn-outline {
      border: 2px solid var(--maroon-light);
      color: var(--maroon-light);
      transition: all 0.2s ease;

    .btn-outline:hover {
      background-color: var(--maroon-light);

    .modal-overlay {

      backdrop-filter: blur(8px);

    .modal-content {
      animation: modalFadeIn 0.25s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      color: white;
      border-radius: 9999px;
      padding: 0.5rem;
      transition: all 0.2s ease;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }
    .nav-arrow:hover {
      background-color: rgba(0,0,0,0.75);
      transform: translateY(-50%) scale(1.05);
    }
    /* Layout header/sidebar styles */
    .prestige-header {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;

    .header-container {

      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hamburger {
      background-color: var(--maroon-light);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .hamburger:hover {
      background-color: var(--maroon);
      transform: scale(1.02);
    }
    .prestige-sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 25px rgba(0,0,0,0.15);

      z-index: 1000;

      color: #666;
      transition: all 0.2s;

    .close-sidebar-btn:hover {

      color: white;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

      display: flex;
      align-items: center;

      // Sports
      { id: 1, type: "image", src: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800&h=600&fit=crop", title: "1st XV Rugby Team - National Champions", description: "Won the U18 National Rugby Cup for the 3rd consecutive year.", category: "Sports", subcategory: "Rugby" },

    ];

    const MediaModal = ({ isOpen, mediaItems, currentIndex, onClose, onNavigate }) => {
      const currentMedia = mediaItems[currentIndex];
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (!isOpen) return;
          if (e.key === 'ArrowLeft') onNavigate('prev');
          else if (e.key === 'ArrowRight') onNavigate('next');
          else if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onNavigate, onClose]);
      if (!isOpen || !currentMedia) return null;
      const handlePrev = (e) => { e.stopPropagation(); onNavigate('prev'); };
      const handleNext = (e) => { e.stopPropagation(); onNavigate('next'); };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={onClose}>
          <div className="modal-content max-w-5xl w-full bg-white rounded-2xl overflow-hidden shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
            <button onClick={onClose} className="absolute top-3 right-3 z-30 bg-black/50 hover:bg-black/70 text-white rounded-full p-2 transition">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button onClick={handlePrev} className="nav-arrow left-4"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg></button>
            <button onClick={handleNext} className="nav-arrow right-4"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg></button>
            <div className="relative">
              {currentMedia.type === "image" ? (
                <img src={currentMedia.src} alt={currentMedia.title} className="w-full max-h-[70vh] object-contain bg-black/10" />
              ) : (
                <video key={currentMedia.src} className="w-full max-h-[70vh]" controls autoPlay poster={currentMedia.poster}>
                  <source src={currentMedia.src} type="video/mp4" />
                </video>
              )}
            </div>
            <div className="p-6 bg-white">
              <h3 className="text-2xl font-display font-bold text-gray-800">{currentMedia.title}</h3>
              <p className="text-gray-600 mt-2">{currentMedia.description}</p>
              <div className="mt-4 flex justify-between items-center">
                <div className="flex gap-2">
                  <span className="text-sm bg-maroon-light/10 px-3 py-1 rounded-full text-maroon-light font-medium">{currentMedia.category}</span>
                  <span className="text-sm bg-beige-deep/50 px-3 py-1 rounded-full text-gray-600">{currentMedia.subcategory}</span>
                </div>
                <div className="text-xs text-gray-400">{currentIndex + 1} / {mediaItems.length}</div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SportsArtsContent = () => {
      const [modalOpen, setModalOpen] = React.useState(false);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const openModal = (index) => { setCurrentIndex(index); setModalOpen(true); };
      const closeModal = () => setModalOpen(false);
      const handleNavigate = (direction) => {
        setCurrentIndex(prev => {
          if (direction === 'prev') return prev === 0 ? mediaItems.length - 1 : prev - 1;
          else return prev === mediaItems.length - 1 ? 0 : prev + 1;
        });
      };
      const sportsItems = mediaItems.filter(item => item.category === "Sports");
      const artsItems = mediaItems.filter(item => item.category === "Arts");
      const handleJoinSports = () => alert("Sports tryout registration form would open.");
      const handleJoinArts = () => alert("Arts club sign-up form would open.");
      const handleScheduleAudition = () => alert("Audition booking form would open.");

      return (
        <>
          {/* Hero */}
          <div className="relative bg-gradient-to-br from-[#F5EFE2] via-[#F5EFE2]/95 to-[#E2D4B6]/40 overflow-hidden">
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/paper-fibers.png')] opacity-20"></div>
            <div className="section-container relative z-10 text-center">
              <div className="inline-block px-4 py-1 rounded-full bg-[#B84A60]/10 text-[#B84A60] font-semibold text-sm mb-6 tracking-wide">SPORTS • ARTS • CULTURE</div>
              <h1 className="text-5xl md:text-7xl font-display font-bold text-gray-800 leading-tight">Where Passion <span className="text-[#B84A60]">Shines</span></h1>
              <div className="maroon-accent-line mx-auto mt-6"></div>
              <p className="mt-6 max-w-2xl mx-auto text-gray-600 text-lg md:text-xl font-light">From the field to the stage — discover excellence in every discipline. Join our award-winning sports teams and vibrant arts community.</p>
              <div className="flex flex-wrap justify-center gap-5 mt-10">
                <button onClick={handleJoinSports} className="btn-primary text-white font-bold py-3 px-8 rounded-full shadow-lg transition">⚽ Join a Sports Team</button>
                <button onClick={handleJoinArts} className="btn-outline font-bold py-3 px-8 rounded-full shadow-md transition">🎭 Join an Arts Club</button>
                <button onClick={handleScheduleAudition} className="bg-white/80 hover:bg-white text-maroon-light font-semibold py-3 px-6 rounded-full shadow transition border border-beige-deep">🎤 Schedule an Audition</button>
              </div>
            </div>
          </div>

          {/* Sports Section */}
          <div className="section-container pt-0">
            <div className="text-center mb-12">
              <span className="text-maroon-light font-semibold tracking-wide text-sm bg-maroon-light/10 px-4 py-1 rounded-full inline-block">EXCELLENCE IN MOTION</span>
              <h2 className="text-3xl md:text-4xl font-display font-bold mt-4 text-gray-800">Sports</h2>
              <div className="maroon-accent-line mx-auto mt-3"></div>
              <p className="text-gray-600 max-w-2xl mx-auto">Rugby, hockey, athletics, basketball, swimming, and more — our athletes compete at provincial and national levels.</p>
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {sportsItems.map((item, idx) => {
                const globalIndex = mediaItems.findIndex(m => m.id === item.id);
                return (
                  <div key={item.id} onClick={() => openModal(globalIndex)} className="prestige-card overflow-hidden cursor-pointer group transition-all duration-300 hover:shadow-xl">
                    <div className="relative aspect-video overflow-hidden bg-beige-deep/30">
                      {item.type === "image" ? (
                        <img src={item.src} alt={item.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />
                      ) : (
                        <>
                          <img src={item.poster} alt={item.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />
                          <div className="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/40 transition">
                            <div className="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center text-maroon-light shadow-lg">
                              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                    <div className="p-4">
                      <h3 className="font-display font-bold text-gray-800 text-lg">{item.title}</h3>
                      <p className="text-sm text-gray-500 mt-1">{item.description}</p>
                      <div className="mt-3 flex justify-between items-center">
                        <span className="text-xs bg-beige-deep/50 px-2 py-1 rounded-full text-maroon-dark">{item.subcategory}</span>
                        <span className="text-maroon-light text-xs font-medium">View →</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Arts Section */}
          <div className="bg-white/40 py-16">
            <div className="section-container">
              <div className="text-center mb-12">
                <span className="text-maroon-light font-semibold tracking-wide text-sm bg-maroon-light/10 px-4 py-1 rounded-full inline-block">CREATIVITY UNLEASHED</span>
                <h2 className="text-3xl md:text-4xl font-display font-bold mt-4 text-gray-800">Arts & Culture</h2>
                <div className="maroon-accent-line mx-auto mt-3"></div>
                <p className="text-gray-600 max-w-2xl mx-auto">Music, drama, visual arts, dance, and debate — our students shine on stage and beyond.</p>
              </div>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {artsItems.map((item, idx) => {
                  const globalIndex = mediaItems.findIndex(m => m.id === item.id);
                  return (
                    <div key={item.id} onClick={() => openModal(globalIndex)} className="prestige-card overflow-hidden cursor-pointer group transition-all duration-300 hover:shadow-xl">
                      <div className="relative aspect-video overflow-hidden bg-beige-deep/30">
                        {item.type === "image" ? (
                          <img src={item.src} alt={item.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />
                        ) : (
                          <>
                            <img src={item.poster} alt={item.title} className="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />
                            <div className="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/40 transition">
                              <div className="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center text-maroon-light shadow-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                      <div className="p-4">
                        <h3 className="font-display font-bold text-gray-800 text-lg">{item.title}</h3>
                        <p className="text-sm text-gray-500 mt-1">{item.description}</p>
                        <div className="mt-3 flex justify-between items-center">
                          <span className="text-xs bg-beige-deep/50 px-2 py-1 rounded-full text-maroon-dark">{item.subcategory}</span>
                          <span className="text-maroon-light text-xs font-medium">View →</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Upcoming Events / Tryouts CTA */}
          <div className="bg-maroon-light/10 py-12">
            <div className="section-container !py-8 text-center">
              <h3 className="text-2xl font-display font-bold text-gray-800">Ready to get involved?</h3>
              <p className="text-gray-600 mt-2">Tryouts for winter sports and auditions for the school musical are now open.</p>
              <div className="flex flex-wrap justify-center gap-5 mt-8">
                <button onClick={handleJoinSports} className="bg-white text-maroon-light font-semibold px-6 py-2 rounded-full shadow flex items-center gap-2">📅 View Tryout Schedule</button>
                <button onClick={handleScheduleAudition} className="bg-maroon-light text-white font-semibold px-6 py-2 rounded-full shadow flex items-center gap-2">🎭 Audition Now</button>
              </div>
            </div>
          </div>

          <MediaModal isOpen={modalOpen} mediaItems={mediaItems} currentIndex={currentIndex} onClose={closeModal} onNavigate={handleNavigate} />
        </>
      );
    };

    // Wrap everything in Layout
    const App = () => (
      <Layout>
        <SportsArtsContent />
      </Layout>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
