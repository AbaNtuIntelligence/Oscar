    /* Custom theme: beige & maroon (Prestige) */
    :root {

      --maroon-light: #B84A60;

    body {

      border-radius: 9999px;

      backdrop-filter: blur(4px);
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;

      top: 0;
      z-index: 40;

      justify-content: space-between;
      align-items: center;

      height: 48px;

      align-items: center;
      justify-content: center;

      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .hamburger:hover {
      background-color: var(--maroon);
      transform: scale(1.02);
    }
    .prestige-sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 25px rgba(0,0,0,0.15);

      z-index: 1000;
      padding: 1.5rem;

      overflow-y: auto;

    }

      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }

      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      transition: all 0.2s;
    }
    .close-sidebar-btn:hover {
      background: var(--maroon-light);
      color: white;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      transition: all 0.2s;
      color: #2d3e50;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover, .nav-link.active {
      background: var(--maroon-light);
      color: white;
    }
    .prestige-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;

    }

      margin: 0 auto;
      padding: 0;

          </div>

          {/* Contact Form Section */}
          <div className="bg-white/40 py-16">
            <div className="section-container !py-8 max-w-4xl">
              <div className="text-center mb-8">
                <h2 className="text-3xl font-display font-bold text-gray-800">Send Us a Message</h2>
                <div className="maroon-accent-line mx-auto mt-3"></div>
                <p className="text-gray-600">We'll get back to you within 24 hours (Monday–Friday).</p>
              </div>
              {submitted && (
                <div className="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded-lg">✅ Thank you! Your message has been sent successfully.</div>
              )}
              <form onSubmit={handleSubmit} className="prestige-card p-6 md:p-8 space-y-5">
                <div className="grid md:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Full Name *</label>
                    <input type="text" name="name" required value={formData.name} onChange={handleChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80 focus:outline-none focus:ring-2 focus:ring-maroon-light/50" />
                  </div>
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Email *</label>
                    <input type="email" name="email" required value={formData.email} onChange={handleChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                  </div>
                </div>
                <div className="grid md:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Phone (optional)</label>
                    <input type="tel" name="phone" value={formData.phone} onChange={handleChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                  </div>
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Subject *</label>
                    <input type="text" name="subject" required value={formData.subject} onChange={handleChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                  </div>
                </div>
                <div>
                  <label className="block text-gray-700 font-medium mb-1">Message *</label>
                  <textarea name="message" rows="5" required value={formData.message} onChange={handleChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80"></textarea>
                </div>
                <div className="flex justify-center">
                  <button type="submit" className="btn-primary text-white font-bold py-3 px-10 rounded-full shadow-lg transition">Send Message ✉️</button>
                </div>
                <p className="text-xs text-gray-400 text-center">By submitting, you consent to our privacy policy.</p>
              </form>
            </div>
          </div>

          {/* Social & Additional CTAs */}
          <div className="bg-maroon-light/10 py-12">
            <div className="section-container !py-8 text-center">
              <h3 className="text-2xl font-display font-bold text-gray-800">Connect With Us Online</h3>
              <div className="flex flex-wrap justify-center gap-8 mt-6">
                <a href="#" className="flex flex-col items-center text-gray-700 hover:text-maroon-light transition">
                  <div className="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-2xl">📘</div>
                  <span className="text-sm mt-2">Facebook</span>
                </a>
                <a href="#" className="flex flex-col items-center text-gray-700 hover:text-maroon-light transition">
                  <div className="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-2xl">🐦</div>
                  <span className="text-sm mt-2">Twitter</span>
                </a>
                <a href="#" className="flex flex-col items-center text-gray-700 hover:text-maroon-light transition">
                  <div className="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-2xl">📸</div>
                  <span className="text-sm mt-2">Instagram</span>
                </a>
                <a href="#" className="flex flex-col items-center text-gray-700 hover:text-maroon-light transition">
                  <div className="w-12 h-12 rounded-full bg-white shadow flex items-center justify-center text-2xl">💼</div>
                  <span className="text-sm mt-2">LinkedIn</span>
                </a>
              </div>
            </div>
          </div>
        </>
      );
    };

    // Wrap everything in Layout
    const App = () => (
      <Layout>
        <ContactContent />
      </Layout>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
