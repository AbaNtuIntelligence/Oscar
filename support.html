      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;

      color: #666;

      color: white;

      flex-direction: column;
      gap: 0.5rem;

      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;

      text-decoration: none;

                  <button onClick={() => handleDonateClick("R500/mo", "Monthly")} className="bg-beige-deep/50 px-3 py-1 rounded-full text-sm">R500/mo</button>

                <button onClick={() => handleDonateClick("Monthly", "Monthly")} className="mt-4 btn-primary text-white py-1.5 px-5 rounded-full text-sm">Become a Partner →</button>
              </div>
              {/* Sponsor a Learner */}
              <div className="prestige-card p-6 text-center">
                <div className="text-4xl mb-3">🎓</div>
                <h3 className="font-display font-bold text-xl">Sponsor a Learner</h3>
                <p className="text-gray-500 text-sm mt-2">R12,000 covers full annual tuition for one deserving student. Change a life.</p>
                <button onClick={() => handleDonateClick("R12,000", "Sponsorship")} className="mt-4 btn-primary text-white py-1.5 px-5 rounded-full text-sm">Sponsor Now →</button>
              </div>
              {/* In-Kind Donations */}
              <div className="prestige-card p-6 text-center">
                <div className="text-4xl mb-3">📚</div>
                <h3 className="font-display font-bold text-xl">In-Kind Gifts</h3>
                <p className="text-gray-500 text-sm mt-2">Laptops, textbooks, sports equipment, musical instruments, or art supplies.</p>
                <button onClick={handleInKind} className="mt-4 btn-outline py-1.5 px-5 rounded-full text-sm">Donate Goods →</button>
              </div>
              {/* Legacy/Wills */}
              <div className="prestige-card p-6 text-center">
                <div className="text-4xl mb-3">📜</div>
                <h3 className="font-display font-bold text-xl">Legacy Giving</h3>
                <p className="text-gray-500 text-sm mt-2">Include Prestige in your will or estate plan. Leave a lasting impact.</p>
                <button onClick={handleLegacy} className="mt-4 btn-outline py-1.5 px-5 rounded-full text-sm">Learn More →</button>
              </div>
              {/* Corporate Partnerships */}
              <div className="prestige-card p-6 text-center">
                <div className="text-4xl mb-3">🏢</div>
                <h3 className="font-display font-bold text-xl">Corporate Matching</h3>
                <p className="text-gray-500 text-sm mt-2">Double your impact. Many employers match donations. Ask your HR department.</p>
                <button onClick={handlePartner} className="mt-4 btn-outline py-1.5 px-5 rounded-full text-sm">Partner with Us →</button>
              </div>
            </div>
          </div>

          {/* Banking Details Section */}
          <div className="bg-white/60 py-12">
            <div className="section-container !py-6 max-w-3xl">
              <div className="prestige-card p-6 md:p-8 text-center">
                <div className="text-4xl mb-3">🏦</div>
                <h3 className="text-2xl font-display font-bold text-gray-800 mb-2">Bank Transfer Details</h3>
                <p className="text-gray-600 text-sm mb-4">All donations are tax-deductible under Section 18A. Use your name as reference.</p>
                <div className="bg-beige-deep/30 rounded-xl p-5 text-left space-y-3 font-mono text-sm">
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Account Name:</span><span className="text-gray-800">Prestige High School Development Trust</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Bank:</span><span className="text-gray-800">First National Bank (FNB)</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Branch Code:</span><span className="text-gray-800">250655 (Corporate)</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Account Number:</span><span className="text-gray-800">628 394 721 09</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Account Type:</span><span className="text-gray-800">Cheque / Current</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">SWIFT/BIC:</span><span className="text-gray-800">FIRNZAJJ (for international)</span></div>
                  <div className="flex justify-between flex-wrap gap-2"><span className="font-semibold text-gray-700">Reference:</span><span className="text-gray-800">Your Name + "Donation"</span></div>
                </div>
                <div className="flex justify-center gap-3 mt-5">
                  <button onClick={() => copyToClipboard("628 394 721 09")} className="btn-outline text-sm py-1.5 px-4 rounded-full">📋 Copy Account Number</button>
                  <button onClick={() => copyToClipboard("Prestige High School Development Trust")} className="btn-outline text-sm py-1.5 px-4 rounded-full">📋 Copy Account Name</button>
                </div>
                <p className="text-xs text-gray-400 mt-4">After transfer, please email proof to finance@prestigehigh.co.za for a Section 18A certificate.</p>
              </div>
            </div>
          </div>

          {/* Featured Project: Library Upgrade */}
          <div className="bg-maroon-light/10 py-16">
            <div className="section-container !py-8">
              <div className="flex flex-col md:flex-row gap-10 items-center">
                <div className="md:w-1/2">
                  <span className="text-maroon-light font-semibold text-sm">CURRENT CAMPAIGN</span>
                  <h2 className="text-3xl font-display font-bold text-gray-800 mt-2">Innovation Hub & Library</h2>
                  <p className="text-gray-600 mt-4">We're building a state-of-the-art media centre with collaborative spaces, a makerspace, and digital research tools. Your gift brings future-ready learning to every student.</p>
                  <div className="mt-4 bg-beige-deep/50 rounded-full h-3 w-full"><div className="bg-maroon-light h-3 rounded-full" style={{width: '45%'}}></div></div>
                  <p className="text-sm text-gray-500 mt-2">R450,000 raised of R1,000,000 goal</p>
                  <button onClick={() => handleDonateClick("Library Fund", "Campaign")} className="mt-5 btn-primary text-white px-6 py-2 rounded-full">Contribute to this Project →</button>
                </div>
                <div className="md:w-1/2 prestige-card p-4">
                  <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600&h=400&fit=crop" alt="Library concept" className="rounded-xl w-full h-64 object-cover" />
                </div>
              </div>
            </div>
          </div>

          {/* Additional CTA Banner */}
          <div className="section-container text-center">
            <div className="prestige-card p-8 max-w-3xl mx-auto">
              <h3 className="text-2xl font-display font-bold">Every Rand Counts</h3>
              <p className="text-gray-600 mt-2">Donate via EFT, credit card, or SnapScan. All contributions are Section 18A tax-deductible.</p>
              <div className="flex flex-wrap justify-center gap-4 mt-6">
                <button onClick={() => handleDonateClick("Any", "Any")} className="btn-primary px-6 py-2 rounded-full">Donate Online</button>
                <button onClick={handleVolunteer} className="btn-outline px-6 py-2 rounded-full">Volunteer Your Time</button>
                <button onClick={handlePartner} className="bg-beige-deep text-gray-800 px-6 py-2 rounded-full">Contact Development Office</button>
              </div>
            </div>
          </div>

          {/* Donation Confirmation Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={closeModal}>
              <div className="bg-white rounded-2xl max-w-md w-full p-6 text-center" onClick={(e) => e.stopPropagation()}>
                <div className="text-5xl mb-3">🎉</div>
                <h3 className="text-2xl font-display font-bold text-gray-800">Thank You!</h3>
                <p className="text-gray-600 mt-2">Your {selectedAmount?.amount} {selectedAmount?.type && `(${selectedAmount.type})`} donation will make a real difference.</p>
                <p className="text-sm text-gray-500 mt-1">You will now be redirected to our secure payment gateway.</p>
                <button onClick={closeModal} className="mt-6 btn-primary text-white px-6 py-2 rounded-full">Close</button>
              </div>
            </div>
          )}
        </>
      );
    };

    // Wrap everything in Layout
    const App = () => (
      <Layout>
        <DonateContent />
      </Layout>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
