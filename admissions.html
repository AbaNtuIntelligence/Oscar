      height: 100%;

                    <p>✓ Certified copy of child's birth certificate</p>

                    <p>✓ ID/Passport of parents/guardians</p>
                    <p>✓ Proof of residence</p>
                    <p>✓ Immunisation record (Grade 8 only)</p>
                    <p>✓ Transfer letter (if applicable)</p>
                  </div>
                </div>
                <div className="prestige-card p-6">
                  <h3 className="text-xl font-display font-bold flex items-center gap-2">💰 Fees & Financial Aid</h3>
                  <div className="mt-4 space-y-3">
                    <p className="flex justify-between"><span>Application fee (non-refundable)</span><span className="font-semibold">R 350</span></p>
                    <p className="flex justify-between"><span>Annual tuition (Grades 8–9)</span><span className="font-semibold">R 98,500</span></p>
                    <p className="flex justify-between"><span>Annual tuition (Grades 10–12)</span><span className="font-semibold">R 112,000</span></p>
                    <p className="text-sm text-maroon-light mt-2">*Merit-based scholarships & bursaries available. Inquire with admissions office.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Online Application Form */}
          <div id="applyForm" className="section-container scroll-mt-20">
            <div className="max-w-3xl mx-auto prestige-card p-6 md:p-8">
              <h2 className="text-3xl font-display font-bold text-center text-gray-800">Apply Online</h2>
              <div className="maroon-accent-line mx-auto mt-2"></div>
              <p className="text-center text-gray-500 mb-6">Fill in the form below and our admissions team will contact you within 48 hours.</p>
              {formSubmitted && (
                <div className="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded-lg">✅ Application received! We'll be in touch soon.</div>
              )}
              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-gray-700 font-medium mb-1">Full Name of Learner *</label>
                  <input type="text" name="fullName" required value={formData.fullName} onChange={handleInputChange} className="w-full p-3 rounded-xl border border-beige-deep focus:outline-none focus:ring-2 focus:ring-maroon-light/50 bg-white/80" />
                </div>
                <div>
                  <label className="block text-gray-700 font-medium mb-1">Parent/Guardian Full Name *</label>
                  <input type="text" name="parentName" required value={formData.parentName} onChange={handleInputChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                </div>
                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Email Address *</label>
                    <input type="email" name="email" required value={formData.email} onChange={handleInputChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                  </div>
                  <div>
                    <label className="block text-gray-700 font-medium mb-1">Phone Number *</label>
                    <input type="tel" name="phone" required value={formData.phone} onChange={handleInputChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80" />
                  </div>
                </div>
                <div>
                  <label className="block text-gray-700 font-medium mb-1">Applying for Grade (2026) *</label>
                  <select name="grade" required value={formData.grade} onChange={handleInputChange} className="w-full p-3 rounded-xl border border-beige-deep bg-white/80">
                    <option value="">Select grade</option>
                    <option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
                  </select>
                </div>
                <div className="pt-4">
                  <button type="submit" className="w-full btn-primary text-white font-bold py-3 rounded-xl shadow-md transition text-lg">Submit Application →</button>
                </div>
                <p className="text-xs text-gray-400 text-center">By submitting, you consent to our admissions process and data handling policy.</p>
              </form>
            </div>
          </div>

          {/* CTA Banner with additional buttons */}
          <div className="bg-maroon-light/10 py-12">
            <div className="section-container !py-8 text-center">
              <h3 className="text-2xl font-display font-bold text-gray-800">Still have questions?</h3>
              <div className="flex flex-wrap justify-center gap-5 mt-6">
                <button className="bg-white text-maroon-light font-semibold px-6 py-2 rounded-full shadow flex items-center gap-2">📞 Call Admissions: +27 12 345 6789</button>
                <button className="bg-maroon-light text-white font-semibold px-6 py-2 rounded-full shadow flex items-center gap-2">✉️ admissions@prestigehigh.co.za</button>
                <button className="border border-maroon-light text-maroon-light font-semibold px-6 py-2 rounded-full flex items-center gap-2">📅 Book a Campus Tour</button>
              </div>
            </div>
          </div>
        </>
      );
    };

    // Wrap everything in Layout
    const App = () => (
      <Layout>
        <AdmissionsContent />
      </Layout>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
